<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goth Godparents Generator</title>

<!-- Opt out of AI/data-mining crawlers that respect these signals -->
<meta name="robots" content="noai, noimageai">
<meta name="robots" content="max-snippet:-1, max-image-preview:none">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #e9e1d6;
    --muted: #7a7280;
    --accent: #8c2f39;
    --gold: #b8964f;
    --line: #262228;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    min-height:100vh;
    background:#000;
    color:var(--ink);
    font-family:'EB Garamond', serif;
    /* discourage casual text-selection/copying across the page */
    -webkit-user-select:none;
    -moz-user-select:none;
    user-select:none;
  }

  .stage{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:8vh 20px;
    text-align:center;
  }

  .eyebrow{
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:0.35em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:18px;
  }

  h1{
    font-family:'UnifrakturMaguntia', cursive;
    font-weight:400;
    font-size:clamp(2.6rem, 8vw, 5rem);
    line-height:1.05;
    margin:0 0 16px;
    color:var(--ink);
  }

  .subhead{
    font-style:italic;
    color:var(--muted);
    font-size:1.05rem;
    max-width:420px;
    margin:0 0 56px;
  }

  .seal{
    width:160px;
    height:64px;
    border-radius:2px;
    border:1px solid var(--accent);
    cursor:pointer;
    background:#0a0a0a;
    color:var(--ink);
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    transition: border-color .25s ease, color .25s ease;
    margin-bottom:20px;
    animation: pulsate 2.4s ease-in-out infinite;
  }
  @keyframes pulsate{
    0%, 100%{
      box-shadow: 0 0 0 0 rgba(140,47,57,0.5);
    }
    50%{
      box-shadow: 0 0 0 10px rgba(140,47,57,0);
    }
  }
  .seal:hover{ border-color:var(--gold); color:var(--gold); }
  .seal:active{ transform:scale(0.96); }
  .seal.stamping{ animation:stamp .5s ease; }
  @keyframes stamp{
    0%{ transform:scale(1); }
    35%{ transform:scale(0.86); }
    60%{ transform:scale(1.05); }
    100%{ transform:scale(1); }
  }
  .seal:disabled{
    cursor:default;
    opacity:0.55;
    animation:none;
  }

  .channeling{
    height:20px;
    margin-bottom:36px;
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:0.25em;
    text-transform:uppercase;
    color:var(--accent);
    opacity:0;
    transition:opacity .3s ease;
  }
  .channeling.active{
    opacity:1;
    display:inline-block;
    animation:channel-flicker 2.6s ease-in-out infinite;
  }
  @keyframes channel-flicker{
    0%, 100%{ transform:scale(1); opacity:0.5; }
    50%{ transform:scale(1.35); opacity:1; }
  }

  .result{
    max-width:420px;
    width:100%;
    opacity:0;
    transform:translateY(8px);
    transition:opacity .5s ease, transform .5s ease;
  }
  .result.visible{ opacity:1; transform:translateY(0); }

  .result-label{
    display:block;
    font-family:'Space Mono', monospace;
    font-size:10px;
    letter-spacing:0.3em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:14px;
  }

  .god-name{
    font-family:'UnifrakturMaguntia', cursive;
    font-size:clamp(1.5rem, 5vw, 2.2rem);
    line-height:1.5;
    margin:0;
    opacity:0;
    filter:blur(6px) brightness(1);
    transform:scale(0.8);
    text-shadow: 0 0 0 rgba(184,150,79,0);
    transition:opacity 1.8s ease, filter 1.8s ease, transform 1.8s ease, text-shadow 1.8s ease;
  }
  .god-name.revealed{
    opacity:1;
    filter:blur(0) brightness(1.25);
    transform:scale(1);
    text-shadow: 0 0 18px rgba(184,150,79,0.55);
  }

  .again{
    margin-top:32px;
    background:none;
    border:none;
    color:var(--muted);
    font-family:'Space Mono', monospace;
    font-size:10px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    cursor:pointer;
    text-decoration:underline;
  }
  .again:hover{ color:var(--gold); }
  .again:disabled{
    cursor:default;
    opacity:0.4;
    text-decoration:none;
  }

  .credits{
    margin-top:80px;
    font-family:'Space Mono', monospace;
    font-size:10px;
    letter-spacing:0.08em;
    color:var(--line);
    text-align:center;
    max-width:480px;
    line-height:1.8;
  }
  .credits .credits-label{
    display:block;
    letter-spacing:0.3em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:10px;
  }
  .credits .name-item{
    color:var(--line);
    transition: color 0.8s ease, text-shadow 0.8s ease;
  }
  .credits .name-item.lit{
    color:var(--gold);
    text-shadow: 0 0 10px rgba(184,150,79,0.5);
  }
  .credits .sep{
    color:var(--line);
  }

  .support{
    margin-top:40px;
    text-align:center;
  }
  .support a{
    display:inline-block;
    font-family:'Space Mono', monospace;
    font-size:10px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--muted);
    text-decoration:none;
    border:1px solid var(--line);
    padding:12px 22px;
    border-radius:2px;
    transition:border-color .2s ease, color .2s ease;
  }
  .support a:hover{
    color:var(--gold);
    border-color:var(--gold);
  }

  .rights{
    margin-top:56px;
    font-family:'Space Mono', monospace;
    font-size:10px;
    letter-spacing:0.08em;
    color:var(--line);
    line-height:1.8;
  }

  @media (prefers-reduced-motion: reduce){
    .seal{ animation:none; }
    .seal.stamping{ animation:none; }
    .result{ transition:none; }
    .channeling.active{ animation:none; opacity:1; }
    .god-name{ transition:none; filter:none; opacity:1; }
  }

  .lightning{
    position:fixed;
    inset:0;
    background:#fff;
    opacity:0;
    pointer-events:none;
    z-index:999;
  }
  .lightning.flash{
    animation: lightning-flash 1.6s ease-out;
  }
  @keyframes lightning-flash{
    0%{ opacity:0; }
    8%{ opacity:0.85; }
    18%{ opacity:0.15; }
    30%{ opacity:0.6; }
    45%{ opacity:0.05; }
    55%{ opacity:0.3; }
    75%{ opacity:0; }
    100%{ opacity:0; }
  }
</style>
<script data-goatcounter="https://gothgodparents.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>

<div class="lightning" id="lightning"></div>

<div class="stage">
  <div class="eyebrow">For the Born Darkly</div>
  <h1>Goth Godparents Generator</h1>
  <p class="subhead">Press the seal. Something in velvet and candle-smoke will claim you as their changeling.</p>

  <button class="seal" id="summonBtn">Summon</button>
  <div class="channeling" id="channeling">Shadows forming&hellip;</div>

  <div class="result" id="result">
    <span class="result-label">You have been claimed by</span>
    <div class="god-name" id="godName">—</div>
    <button class="again" id="againBtn">Draw again</button>
  </div>

  <div class="credits">
    <span class="credits-label">In the lineage of</span>
    <span id="creditsList"></span>
  </div>

  <div class="support">
    <a href="https://ko-fi.com/gothgodparents" target="_blank" rel="noopener">Support this ritual</a>
  </div>

  <div class="rights">Copyright (c) 2026 wyrddistrodoor<br>All Rights Reserved.</div>
</div>

<script>
(function(){
  const lineage = [
    "Screamin' Jay Hawkins","Percy Bysshe Shelley","Lord Byron","Christopher Marlowe",
    "Emily Dickinson","Eartha Kitt","Edgar Allan Poe","Siouxsie Sioux","Ian Curtis",
    "Peter Murphy","Grace Jones","Albie Mason","The Sisters of Mercy","Peter Gabriel",
    "The Cramps","Robert Smith","Vincent van Gogh","Jacques-Louis David",
    "Artemisia Gentileschi","Bad Brains","Death","Pure Hell","Poly Styrene",
    "Arthur Rimbaud","Dante Gabriel Rossetti","Joy Division","Bauhaus","Bela Lugosi",
    "Nick Cave","Lydia Lunch","Rozz Williams","Andi Sex Gang","Wayne Hussey",
    "Steven Severin","Danielle Dax","Killing Joke","Alien Sex Fiend","Xmal Deutschland",
    "The Birthday Party","Diamanda Galás","Patti Smith","Richard Hell","The Damned",
    "X-Ray Spex","Nina Hagen","Suicide (the band)","Alice Bag","Mary Shelley",
    "Bram Stoker","Charlotte Brontë","Emily Brontë","Sheridan Le Fanu","Ann Radcliffe",
    "Matthew Lewis","John Polidori","Charles Baudelaire","Shirley Jackson",
    "Angela Carter","Vincent Price","Lon Chaney","Theda Bara","Elvira",
    "Francisco Goya","Gustave Doré","Egon Schiele","Hieronymus Bosch","Käthe Kollwitz",
    "Edvard Munch","Aubrey Beardsley","The Somnambulist","The Cult","Barnabas Collins",
    "Beetlejuice","Wednesday Addams","Heathcliff","The Phantom of the Opera",
    "Dr. Jekyll and Mr. Hyde","Robert Louis Stevenson","Sethe","Angela Toussaint",
    "Frederick Douglass","Octavia E. Butler","Toni Morrison","Jane Eyre",
    "Horace Walpole","The Castle of Otranto","Daphne du Maurier",
    "Paschal Beverly Randolph","Rollo Ahmed","Éliphas Lévi","Franz Anton Mesmer",
    "Johann Wolfgang Von Goethe","Uriah Derick D'Arcy","Karl Heinrich Ulrichs",
    "Paul Féval","Otto Goetzi","Morticia Addams","Gilda","Blacula","Renfield",
    "Lydia Deetz","The Lady of Shalott","The River Styx","Sir Edward Burne-Jones",
    "Henry Fuseli","William Blake","Divide and Dissolve","Edinburgh","Glasgow","Faust",
    "Lovecraft Country","Lestat","Dorian Gray","The Cabinet of Dr. Caligari","Edward Scissorhands","The Cure",
    "Casino Shanghai","Dark Chisme","Meldamor","Puerta Negra","Church Fire"
  ];

  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  let lastPair = null;
  function generate(){
    let a, b, pairKey;
    do {
      a = pick(lineage);
      do { b = pick(lineage); } while(b === a);
      pairKey = [a,b].sort().join('|');
    } while(pairKey === lastPair && lineage.length > 2);
    lastPair = pairKey;
    return [a, b];
  }

  const summonBtn = document.getElementById('summonBtn');
  const againBtn = document.getElementById('againBtn');
  const result = document.getElementById('result');
  const godName = document.getElementById('godName');
  const channeling = document.getElementById('channeling');

  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let summoning = false;

  function setButtonsDisabled(disabled){
    summonBtn.disabled = disabled;
    againBtn.disabled = disabled;
  }

  function summon(){
    if(summoning) return;
    summoning = true;

    setButtonsDisabled(true);
    summonBtn.classList.add('stamping');
    setTimeout(()=> summonBtn.classList.remove('stamping'), 500);

    // hide any previous reveal while we "channel" the next one
    godName.classList.remove('revealed');
    channeling.classList.add('active');

    const [a, b] = generate();

    const delay = prefersReducedMotion ? 0 : 1800 + Math.random()*1400; // ~1.8-3.2s of suspense

    setTimeout(()=>{
      channeling.classList.remove('active');
      godName.innerHTML = a + '<br>&amp;<br>' + b;
      result.classList.add('visible');
      // next tick so the blur/opacity transition actually plays
      requestAnimationFrame(()=> godName.classList.add('revealed'));
      setButtonsDisabled(false);
      summoning = false;
    }, delay);
  }

  summonBtn.addEventListener('click', summon);
  againBtn.addEventListener('click', summon);

  // ---------- lightning + thunder ----------
  const lightningEl = document.getElementById('lightning');
  let audioCtx = null;

  function unlockAudio(){
    if(!audioCtx){
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e){ audioCtx = null; }
    }
  }
  summonBtn.addEventListener('click', unlockAudio, { once:true });

  function playThunder(){
    if(!audioCtx) return;
    const now = audioCtx.currentTime;
    const duration = 3.2 + Math.random()*1.6;

    const bufferSize = audioCtx.sampleRate * duration;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2 - 1); }

    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(400, now);
    filter.frequency.linearRampToValueAtTime(90, now + duration);

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.5, now + 0.1);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);

    noise.start(now);
    noise.stop(now + duration);
  }

  function strike(){
    if(prefersReducedMotion) return;
    lightningEl.classList.remove('flash');
    void lightningEl.offsetWidth; // restart animation
    lightningEl.classList.add('flash');
    setTimeout(playThunder, 150 + Math.random()*250);
  }

  function scheduleNextStrike(){
    const delay = 9000 + Math.random()*18000; // 9–27s between strikes
    setTimeout(()=>{
      strike();
      scheduleNextStrike();
    }, delay);
  }

  if(!prefersReducedMotion){
    scheduleNextStrike();
  }

  // ---------- credits list: render + random highlight ----------
  const creditsList = document.getElementById('creditsList');
  const nameSpans = [];
  lineage.forEach((name, i) => {
    const span = document.createElement('span');
    span.className = 'name-item';
    span.textContent = name;
    creditsList.appendChild(span);
    nameSpans.push(span);
    if(i < lineage.length - 1){
      const sep = document.createElement('span');
      sep.className = 'sep';
      sep.textContent = ' · ';
      creditsList.appendChild(sep);
    }
  });

  function highlightRandomName(){
    const span = nameSpans[Math.floor(Math.random()*nameSpans.length)];
    span.classList.add('lit');
    setTimeout(()=> span.classList.remove('lit'), 1400 + Math.random()*800);
  }

  function scheduleNextHighlight(){
    const delay = 500 + Math.random()*900; // roughly every 0.5–1.4s
    setTimeout(()=>{
      highlightRandomName();
      scheduleNextHighlight();
    }, delay);
  }

  if(!prefersReducedMotion){
    scheduleNextHighlight();
  }

  // ---------- light copy deterrents (casual copy/paste only — ----------
  // ---------- does NOT and cannot prevent view-source/devtools) --------
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('copy', (e) => e.preventDefault());
})();
</script>

</body>
</html>
